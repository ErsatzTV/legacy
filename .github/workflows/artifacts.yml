name: Build Artifacts
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to upload assets to (may be a draft), e.g. v26.10.0 or v26.11.0-f8410286-develop'
        required: true
        type: string
      release_repo:
        description: 'Repository that holds the release (e.g. ErsatzTV/legacy-develop-builds); defaults to this repository'
        required: false
        type: string
        default: ''
      release_app_id:
        description: 'GitHub App that can write releases to release_repo; required with release_repo'
        required: false
        type: string
        default: ''
    secrets:
      apple_developer_certificate_p12_base64:
        required: true
      apple_developer_certificate_password:
        required: true
      ac_username:
        required: true
      ac_password:
        required: true
      gh_token:
        required: true
      azure_client_id:
        required: true
      azure_tenant_id:
        required: true
      azure_subscription_id:
        required: true
      release_app_private_key:
        required: false
permissions:
  id-token: write
  contents: write
# asset names carry the full tag; binaries report the tag without -develop, plus the target
env:
  TAG: ${{ inputs.tag }}
jobs:
  build_and_upload_mac:
    name: Mac Build & Upload
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            kind: macOS
            target: osx-x64
            ffmpeg_target: macos64
            ffmpeg_sha256: 6934c4313613c33b61c63bfcd6d2b7548e7678470aba707bbc441b01b118a62f
          - os: macos-14
            kind: macOS
            target: osx-arm64
            ffmpeg_target: macosarm64
            ffmpeg_sha256: 45c0d193410fba877dbca772ec83037f5f77111f859c03bde07aaa9743350c6c
    steps:
      - name: Get the sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Clean
        run: dotnet clean --configuration Release && dotnet nuget locals all --clear

      - name: Install dependencies
        run: dotnet restore -r "${{ matrix.target}}"

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.apple_developer_certificate_p12_base64 }}
          p12-password: ${{ secrets.apple_developer_certificate_password }}

      - name: Calculate Release Name
        shell: bash
        run: |
          release_name="ErsatzTV-Legacy-${TAG}-${{ matrix.target }}"
          echo "RELEASE_NAME=${release_name}" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          sed -i '' '/Scanner/d' ErsatzTV/ErsatzTV.csproj
          dotnet publish ErsatzTV.Scanner/ErsatzTV.Scanner.csproj --framework net10.0 --runtime "${{ matrix.target }}" -c Release -o publish -p:RestoreEnablePackagePruning=true -p:InformationalVersion="${TAG%-develop}-${{ matrix.target }}" -p:EnableCompressionInSingleFile=false -p:DebugType=Embedded -p:PublishSingleFile=true --self-contained true
          dotnet publish ErsatzTV/ErsatzTV.csproj --framework net10.0 --runtime "${{ matrix.target }}" -c Release -o publish -p:RestoreEnablePackagePruning=true -p:InformationalVersion="${TAG%-develop}-${{ matrix.target }}" -p:EnableCompressionInSingleFile=false -p:DebugType=Embedded -p:PublishSingleFile=true --self-contained true

      - name: Bundle
        shell: bash
        run: |
          brew install coreutils
          # bundle versions must be numeric: v26.11.0-f8410286-develop -> 26.11.0
          bundle_version="${TAG#v}"
          bundle_version="${bundle_version%%-*}"
          plutil -replace CFBundleShortVersionString -string "$bundle_version" ErsatzTV-macOS/ErsatzTV-macOS/Info.plist
          plutil -replace CFBundleVersion -string "$bundle_version" ErsatzTV-macOS/ErsatzTV-macOS/Info.plist
          scripts/macOS/bundle.sh

      - name: Bundle ersatztv-channel from next
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next_target="${{ matrix.target }}"
          next_target="${next_target/osx/macos}"
          gh release download develop --repo ErsatzTV/next --pattern "ersatztv-next-*-${next_target}.tar.gz" --dir next-download
          mkdir next-extracted
          tar xzvf next-download/*.tar.gz -C next-extracted --strip-components 1
          mv next-extracted/ersatztv-channel ErsatzTV-Legacy.app/Contents/MacOS/
          chmod +x ErsatzTV-Legacy.app/Contents/MacOS/ersatztv-channel
          rm -rf next-download next-extracted

      # the pinned hashes are the release's SHA256SUMS entries
      - name: Download ffmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="ffmpeg-n8.1.2-etv.4-${{ matrix.ffmpeg_target }}-gpl-8.1.tar.xz"
          gh release download 8.1.2-4 --repo ErsatzTV/ErsatzTV-ffmpeg --dir ffmpeg --pattern "$archive"
          echo "${{ matrix.ffmpeg_sha256 }}  ffmpeg/${archive}" | shasum -a 256 -c
          tar xJf "ffmpeg/${archive}" -C ffmpeg --strip-components 1

      - name: Sign
        shell: bash
        run: scripts/macOS/sign.sh ffmpeg/bin

      - name: Create DMG
        shell: bash
        run: |
          brew install create-dmg
          create-dmg \
            --volname "ErsatzTV-Legacy" \
            --volicon "artwork/ErsatzTV.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "ErsatzTV.app" 200 190 \
            --hide-extension "ErsatzTV.app" \
            --app-drop-link 600 185 \
            --skip-jenkins \
            --no-internet-enable \
            "ErsatzTV-Legacy.dmg" \
            "ErsatzTV-Legacy.app/"

      - name: Notarize
        shell: bash
        run: |
          xcrun notarytool submit ErsatzTV-Legacy.dmg --apple-id "${{ secrets.ac_username }}" --password "${{ secrets.ac_password }}" --team-id 32MB98Q32R --wait
          xcrun stapler staple ErsatzTV-Legacy.dmg

      - name: Cleanup
        shell: bash
        run: |
          mv ErsatzTV-Legacy.dmg "${{ env.RELEASE_NAME }}.dmg"
          rm -r publish
          rm -r ErsatzTV-Legacy.app
          rm -r ffmpeg

      # github.token can't write to another repository; with only owner set, the token covers the
      # repositories the app is installed on
      - name: Get release repository token
        id: release-token
        if: inputs.release_repo != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.release_app_id }}
          private-key: ${{ secrets.release_app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Publish
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || github.token }}
          RELEASE_REPO: ${{ inputs.release_repo || github.repository }}
        run: gh release upload "$TAG" "${{ env.RELEASE_NAME }}.dmg" --clobber --repo "$RELEASE_REPO"

  build_and_upload_linux:
    name: Build & Upload Linux
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
            target: linux-x64
          - os: ubuntu-latest
            kind: linux
            target: linux-musl-x64
          - os: ubuntu-24.04-arm
            kind: linux
            target: linux-arm64
    steps:
      - name: Get the sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Clean
        run: dotnet clean --configuration Release && dotnet nuget locals all --clear

      - name: Install dependencies
        run: dotnet restore -r "${{ matrix.target }}"

      - name: Build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Define some variables for things we need
          release_name="ErsatzTV-Legacy-${TAG}-${{ matrix.target }}"
          echo "RELEASE_NAME=${release_name}" >> "$GITHUB_ENV"

          # Build everything
          sed -i '/Scanner/d' ErsatzTV/ErsatzTV.csproj
          dotnet publish ErsatzTV.Scanner/ErsatzTV.Scanner.csproj --framework net10.0 --runtime "${{ matrix.target }}" -c Release -o "scanner" -p:RestoreEnablePackagePruning=true -p:InformationalVersion="${TAG%-develop}-${{ matrix.target }}" -p:EnableCompressionInSingleFile=true -p:DebugType=Embedded -p:PublishSingleFile=true --self-contained true
          dotnet publish ErsatzTV/ErsatzTV.csproj --framework net10.0 --runtime "${{ matrix.target }}" -c Release -o "main" -p:RestoreEnablePackagePruning=true -p:InformationalVersion="${TAG%-develop}-${{ matrix.target }}" -p:EnableCompressionInSingleFile=true -p:DebugType=Embedded -p:PublishSingleFile=true --self-contained true
          mkdir "$release_name"
          mv scanner/* "$release_name/"
          mv main/* "$release_name/"

          # download next artifacts
          gh release download develop --repo ErsatzTV/next --pattern "ersatztv-next-*-${{ matrix.target }}.tar.gz" --dir next-download
          mkdir next-extracted
          tar xzvf next-download/*.tar.gz -C next-extracted --strip-components 1
          mv next-extracted/ersatztv-channel "$release_name/"
          rm -rf next-download next-extracted

          tar czvf "${release_name}.tar.gz" "$release_name"

          # Delete output directory
          rm -r "$release_name"

      - name: Get release repository token
        id: release-token
        if: inputs.release_repo != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.release_app_id }}
          private-key: ${{ secrets.release_app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Publish
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || github.token }}
          RELEASE_REPO: ${{ inputs.release_repo || github.repository }}
        run: gh release upload "$TAG" "${{ env.RELEASE_NAME }}.tar.gz" --clobber --repo "$RELEASE_REPO"

  build_dotnet_windows:
    name: Build dotnet for Windows
    runs-on: ubuntu-latest
    steps:
      - name: Get the sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Clean
        run: dotnet clean --configuration Release && dotnet nuget locals all --clear

      - name: Install dependencies
        run: dotnet restore -r "win-x64"

      - name: Build dotnet projects
        shell: bash
        run: |
          sed -i '/Scanner/d' ErsatzTV/ErsatzTV.csproj
          dotnet publish ErsatzTV.Scanner/ErsatzTV.Scanner.csproj --framework net10.0 --runtime "win-x64" -c Release -o "scanner" -p:RestoreEnablePackagePruning=true -p:InformationalVersion="${TAG%-develop}-win-x64" -p:EnableCompressionInSingleFile=true -p:DebugType=Embedded -p:PublishSingleFile=true --self-contained true
          dotnet publish ErsatzTV/ErsatzTV.csproj --framework net10.0 --runtime "win-x64" -c Release -o "main" -p:RestoreEnablePackagePruning=true -p:InformationalVersion="${TAG%-develop}-win-x64" -p:EnableCompressionInSingleFile=true -p:DebugType=Embedded -p:PublishSingleFile=true --self-contained true

      - name: Upload .NET Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-windows-build
          path: |
            scanner/
            main/
          retention-days: 1

  package_and_upload_windows:
    name: Package & Upload Windows
    runs-on: windows-latest
    needs: build_dotnet_windows
    environment: signing
    steps:
      - name: Download dotnet artifacts
        uses: actions/download-artifact@v4
        with:
          name: dotnet-windows-build
          path: dotnet-build

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure_client_id }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          subscription-id: ${{ secrets.azure_subscription_id }}
          enable-AzPSSession: true

      - name: Sign dotnet artifacts
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ArtifactSigning
          certificate-profile-name: ErsatzTV
          files-folder: ${{ github.workspace }}/dotnet-build
          files-folder-recurse: true
          files-folder-filter: ErsatzTV.exe,ErsatzTV.Scanner.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Download rust launcher
        uses: suisei-cn/actions-download-file@v1.3.0
        with:
          url: "https://github.com/ErsatzTV/ErsatzTV-Windows/releases/download/v1.0.0/ErsatzTV-Windows.exe"
          target: rust-build/

      # the pinned hash is the release's SHA256SUMS entry
      - name: Download ffmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 8.1.2-4 --repo ErsatzTV/ErsatzTV-ffmpeg --dir ffmpeg \
            --pattern ffmpeg-n8.1.2-etv.4-win64-gpl-8.1.zip
          echo "3423b3afe19ea626adb9b4c54d34ff0a05602f2839210e980a402b225fe37761  ffmpeg/ffmpeg-n8.1.2-etv.4-win64-gpl-8.1.zip" | sha256sum -c

      - name: Package artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_name="ErsatzTV-Legacy-${TAG}-win-x64"
          echo "RELEASE_NAME=${release_name}" >> "$GITHUB_ENV"
          mkdir "$release_name"

          mv dotnet-build/scanner/* "$release_name/"
          mv dotnet-build/main/* "$release_name/"

          # dotnet shouldn't copy the resources here, but it does
          rm -rf "$release_name/Resources"

          mv rust-build/ErsatzTV-Windows.exe "$release_name/ErsatzTV-Windows.exe"

          # download next artifacts
          gh release download develop --repo ErsatzTV/next --pattern "ersatztv-next-*-windows-x64.zip" --dir next-download
          7z x next-download/*.zip -onext-extracted
          mv next-extracted/ersatztv-next-*/ersatztv-channel.exe "$release_name/"
          mv next-extracted/ersatztv-next-*/libvpl.dll "$release_name/"
          mv next-extracted/ersatztv-next-*/libvpl-LICENSE.txt "$release_name/"
          rm -rf next-download next-extracted

          7z e ffmpeg/ffmpeg-n8.1.2-etv.4-win64-gpl-8.1.zip -o"$release_name" '*.exe' -r

          (cd "${release_name}" && 7z a "../${release_name}.zip" .)

      - name: Get release repository token
        id: release-token
        if: inputs.release_repo != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.release_app_id }}
          private-key: ${{ secrets.release_app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || github.token }}
          RELEASE_REPO: ${{ inputs.release_repo || github.repository }}
        run: gh release upload "$TAG" "${{ env.RELEASE_NAME }}.zip" --clobber --repo "$RELEASE_REPO"
